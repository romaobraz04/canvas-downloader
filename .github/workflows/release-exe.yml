name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller python-dotenv requests matplotlib

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --name canvas-downloader --add-data "canvas_downloader/assets;canvas_downloader/assets" main.py

      - name: Package release zip
        run: |
          Compress-Archive -Path "dist/canvas-downloader.exe", ".env.example" -DestinationPath "canvas-downloader-windows.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: canvas-downloader-windows.zip
